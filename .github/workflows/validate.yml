name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_wrapper: false
          tofu_version: 1.13.8

      - name: fmt
        run: tofu fmt -check -recursive

      - name: init
        run: tofu init -backend=false

      - name: validate
        run: tofu validate

      # Uses mock_provider, so it needs no Azure credentials and no network
      # beyond the provider download already done by `init`.
      - name: test
        run: tofu test

      - name: validate example
        working-directory: examples/basic
        run: |
          tofu init -backend=false
          tofu validate
